[platformio]
default_envs = sender

[env]
platform = espressif32 @ 7.0.0
board = featheresp32
framework = arduino
monitor_speed = 115200

[env:sender]
build_src_filter = -<*> +<sender.cpp>
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2

[env:receiver]
build_src_filter = -<*> +<receiver.cpp> +<vibration.cpp>

[env:vibration_test]
build_src_filter = -<*> +<vibration_test.cpp>

; Standalone piezo contact-mic/vibration sensor test (GPIO 27, ADC2).
[env:listener_test]
build_src_filter = -<*> +<listener_test.cpp>

; Tone generator for listener_test to listen to (GPIO 21).
[env:beeper_test]
build_src_filter = -<*> +<beeper_test.cpp>

[env:heartrate]
build_src_filter = -<*> +<heartrate.cpp>
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2

[env:lora_test]
build_src_filter = -<*> +<lora_test.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0

; Same LoRa test for board 1: its SCK pad is dead (SCK on A0/GPIO26) and G0 is
; on A1/GPIO25. Plain lora_test keeps the CAD pins (SCK5, G0 15).
[env:lora_test_board1]
build_src_filter = -<*> +<lora_test.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0
build_flags = -DLORA_SCK=26 -DLORA_DIO0=25

; RFM96W LoRa test for the ESP32 Lite (Wemos/LOLIN32 Lite). Same test as
; lora_test with the Lite pin map: SCK18 MISO19 MOSI23 CS33 RST27 G0 25.
[env:lora_test_lite]
board = lolin32_lite
build_src_filter = -<*> +<lora_test_lite.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0

; Peripheral check for the ESP32 Lite: MAX30102 on SDA16/SCL17 and the
; buzzer/vibration output on GPIO32.
[env:peripheral_test_lite]
board = lolin32_lite
build_src_filter = -<*> +<peripheral_test_lite.cpp>
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2
