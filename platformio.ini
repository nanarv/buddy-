[platformio]
default_envs = sender

[env]
platform = espressif32 @ 7.0.0
board = featheresp32
framework = arduino
monitor_speed = 115200

[env:sender]
build_src_filter = -<*> +<sender.cpp>
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2

[env:receiver]
build_src_filter = -<*> +<receiver.cpp> +<vibration.cpp>

[env:vibration_test]
build_src_filter = -<*> +<vibration_test.cpp>

; Standalone piezo contact-mic/vibration sensor test (GPIO 27, ADC2).
[env:listener_test]
build_src_filter = -<*> +<listener_test.cpp>

; Tone generator for listener_test to listen to (GPIO 21).
[env:beeper_test]
build_src_filter = -<*> +<beeper_test.cpp>

[env:heartrate]
build_src_filter = -<*> +<heartrate.cpp>
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2

[env:lora_test]
build_src_filter = -<*> +<lora_test.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0
